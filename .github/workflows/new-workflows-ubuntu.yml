name: new workflows ubuntu

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Restore cache (Absolute Priority)
      - name: Restore persistent drive
        uses: actions/cache/restore@v4
        with:
          path: ~/persistent
          key: new-vm-persistent-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            new-vm-persistent-ubuntu-

      # 2. Install ONLY minimal networking/VNC tools to start the tunnel ASAP
      - name: Install minimal VNC/Network tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tightvncserver novnc websockify wget curl

      # 3. Setup VNC, noVNC, and Cloudflare Tunnel immediately
      - name: Start VNC and CF Tunnel
        run: |
          mkdir -p ~/.vnc
          echo "password" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # Custom xstartup: Shows a grey screen and waits for background XFCE installation to finish
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/bash
          xrdb $HOME/.Xresources
          xsetroot -solid grey
          echo "Waiting for XFCE installation to complete..."
          while ! command -v xfce4-session >/dev/null 2>&1; do sleep 2; done
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

          # Start VNC & noVNC
          vncserver :1 -geometry 1920x1080 -depth 24
          websockify --web /usr/share/novnc/ 6080 localhost:5901 &

          # Start Cloudflare Tunnel
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 2>&1 | tee /tmp/cloudflared.log &
          sleep 8
          
          echo "========================================"
          echo "OPEN THIS URL (Desktop will appear once background install finishes):"
          grep -o 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's|$|/vnc.html|'
          echo "========================================"
        env:
          USER: runner

      # 4. Push all heavy desktop environments and apps to the background
      - name: Parallel Background Installations
        run: |
          (
            echo "Starting heavy installations in background..."
            
            # Install Desktop Environment
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies
            
            # Install Google Chrome (Needed for your desktop shortcut)
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y google-chrome-stable
            
            # Install pnpm
            curl -fsSL https://get.pnpm.io/install.sh | sh -
            
            # Setup Antigravity IDE repo and install
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg
            echo "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list > /dev/null
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y antigravity
            
            echo "✅ Background installations completed. XFCE will now load in your VNC session."
          ) &> ~/background_install.log &

      # 5. Configure Session Persistence
      - name: Configure Session Persistence
        run: |
          mkdir -p ~/persistent/chrome-profile
          mkdir -p ~/persistent/antigravity-ide
          
          mkdir -p ~/.gemini
          if [ ! -L ~/.gemini/antigravity-ide ]; then
            ln -sf ~/persistent/antigravity-ide ~/.gemini/antigravity-ide
          fi

          mkdir -p ~/Desktop
          cat << 'EOF' > ~/Desktop/chrome.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Persistent Chrome
          Comment=Launches Chrome with a persistent profile
          Exec=google-chrome --user-data-dir=/home/runner/persistent/chrome-profile --no-sandbox
          Icon=google-chrome
          Terminal=false
          StartupNotify=true
          EOF
          chmod +x ~/Desktop/chrome.desktop

      # 6. Keep alive + auto-restart
      - name: Keep alive + auto-restart
        run: |
          mkdir -p ~/persistent

          while true; do
            if [ -f ~/persistent/STOP ]; then
              echo "🛑 STOP file detected, shutting down..."
              rm ~/persistent/STOP
              exit 0
            fi

            if ! pgrep -f websockify > /dev/null; then
              echo "⚠️ websockify died, restarting..."
              websockify --web /usr/share/novnc/ 6080 localhost:5901 &
              sleep 2
            fi

            if ! pgrep -f cloudflared > /dev/null; then
              echo "⚠️ cloudflared died, restarting..."
              ./cloudflared tunnel --url http://localhost:6080 2>&1 | tee /tmp/cloudflared.log &
              sleep 8
              echo "========================================"
              echo "NEW URL:"
              grep -o 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's|$|/vnc.html|'
              echo "========================================"
            fi

            sleep 10
          done

      # 7. Save the updated persistent volume
      - name: Save persistent drive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/persistent
          key: new-vm-persistent-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
