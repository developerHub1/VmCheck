name: new workflows ubuntu

on:
  workflow_dispatch:

jobs:
  # 1. Run independent preparation tasks in parallel
  prepare-cache:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Restore persistent drive
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/persistent
          key: new-vm-persistent-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            new-vm-persistent-ubuntu-

  install-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Install desktop + VNC + noVNC + AGI IDE dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xfce4 xfce4-goodies tightvncserver novnc websockify
          
          # Pre-install AGI IDE repo setup
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg
          echo "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/ antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list > /dev/null
          sudo apt update && sudo apt install -y antigravity

  # 2. Main Desktop Job (Waits for parallel setup to finish if needed, or runs sequentially if everything must live on the same ephemeral runner instance)
  desktop:
    needs: [prepare-cache, install-environment]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # Re-pull cache into this specific runner instance
      - name: Restore persistent drive on main runner
        uses: actions/cache@v4
        with:
          path: ~/persistent
          key: new-vm-persistent-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            new-vm-persistent-ubuntu-

      - name: Install dependencies on main runner
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xfce4 xfce4-goodies tightvncserver novnc websockify
          curl -fsSL https://get.pnpm.io/install.sh | sh -
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      # Configure Session Persistence
      - name: Configure Session Persistence
        run: |
          mkdir -p ~/persistent/chrome-profile
          mkdir -p ~/persistent/antigravity-ide
          
          mkdir -p ~/.gemini
          if [ ! -L ~/.gemini/antigravity-ide ]; then
            ln -sf ~/persistent/antigravity-ide ~/.gemini/antigravity-ide
            echo "✅ Linked Antigravity IDE directory to persistent storage."
          fi

          mkdir -p ~/Desktop
          echo "[Desktop Entry]" > ~/Desktop/chrome.desktop
          echo "Version=1.0" >> ~/Desktop/chrome.desktop
          echo "Type=Application" >> ~/Desktop/chrome.desktop
          echo "Name=Persistent Chrome" >> ~/Desktop/chrome.desktop
          echo "Comment=Launches Chrome with a persistent profile" >> ~/Desktop/chrome.desktop
          echo "Exec=google-chrome --user-data-dir=/home/runner/persistent/chrome-profile --no-sandbox" >> ~/Desktop/chrome.desktop
          echo "Icon=google-chrome" >> ~/Desktop/chrome.desktop
          echo "Terminal=false" >> ~/Desktop/chrome.desktop
          echo "StartupNotify=true" >> ~/Desktop/chrome.desktop
          chmod +x ~/Desktop/chrome.desktop
          echo "✅ Created 'Persistent Chrome' shortcut on Desktop."

      # Start VNC server
      - name: Start VNC server
        run: |
          mkdir -p ~/.vnc
          echo "password" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          vncserver :1 -geometry 1920x1080 -depth 24
        env:
          USER: runner

      # Start noVNC
      - name: Start noVNC
        run: |
          websockify --web /usr/share/novnc/ 6080 localhost:5901 &

      # Start Cloudflare Tunnel
      - name: Start Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 2>&1 | tee /tmp/cloudflared.log &
          sleep 8
          echo "========================================"
          echo "OPEN THIS URL:"
          grep -o 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's|$|/vnc.html|'
          echo "========================================"

      # Keep alive + auto-restart
      - name: Keep alive + auto-restart
        run: |
          mkdir -p ~/persistent

          while true; do
            if [ -f ~/persistent/STOP ]; then
              echo "🛑 STOP file detected, shutting down..."
              rm ~/persistent/STOP
              exit 0
            fi

            if ! pgrep -f websockify > /dev/null; then
              echo "⚠️ websockify died, restarting..."
              websockify --web /usr/share/novnc/ 6080 localhost:5901 &
              sleep 2
            fi

            if ! pgrep -f cloudflared > /dev/null; then
              echo "⚠️ cloudflared died, restarting..."
              ./cloudflared tunnel --url http://localhost:6080 2>&1 | tee /tmp/cloudflared.log &
              sleep 8
              echo "========================================"
              echo "NEW URL:"
              grep -o 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's|$|/vnc.html|'
              echo "========================================"
            fi

            sleep 10
          done

      # Save the updated persistent volume
      - name: Save persistent drive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/persistent
          key: new-vm-persistent-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
