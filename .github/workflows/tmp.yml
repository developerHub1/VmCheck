name: new workflows windows

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      # 1. Restore the persistent drive (Carries over Chrome and Antigravity IDE config)
      - name: Restore persistent drive
        uses: actions/cache@v4
        with:
          path: D:\persistent
          key: vm-persistent-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vm-persistent-windows-

      # 2. Uninstall Microsoft Edge to prevent resource usage/interference
      - name: Uninstall Microsoft Edge
        run: |
          $setupPaths = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\*\Installer\setup.exe",
            "C:\Program Files\Microsoft\Edge\Application\*\Installer\setup.exe"
          )
          $uninstalled = $false
          foreach ($path in $setupPaths) {
            $EdgeInstallerPath = Get-ChildItem -Path $path -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if ($EdgeInstallerPath) {
              Write-Host "Uninstalling Microsoft Edge using $EdgeInstallerPath..."
              Start-Process -FilePath $EdgeInstallerPath -ArgumentList "--uninstall", "--system-level", "--verbose-logging", "--force-uninstall" -Wait -NoNewWindow
              $uninstalled = $true
              break
            }
          }
          if (-not $uninstalled) {
            Write-Host "Trying winget to uninstall Microsoft Edge..."
            winget uninstall --id Microsoft.Edge --silent --accept-source-agreements --accept-package-agreements --force
          }
        shell: powershell
        continue-on-error: true

      # 3. Install pnpm by default (non-persistent)
      - name: Pre-install Dependencies (pnpm)
        run: |
          # Install pnpm via standalone script
          Invoke-WebRequest -Uri https://get.pnpm.io/install.ps1 -OutFile install-pnpm.ps1
          powershell -ExecutionPolicy Bypass -File install-pnpm.ps1 -None
          
          # Force export pnpm to the global GitHub runner path context
          $pnpmHome = "$env:LOCALAPPDATA\pnpm"
          if (Test-Path "$pnpmHome\bin") { $pnpmHome = "$pnpmHome\bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $pnpmHome
          Write-Host "✅ pnpm installed successfully."
        shell: powershell

      # 4. Configure Profile Redirections to D:\persistent
      - name: Configure Session Persistence
        run: |
          # Ensure all target folders inside our persistent volume exist
          $chromeDir = "D:\persistent\chrome-profile"
          $ideDir = "D:\persistent\antigravity-ide"
          
          New-Item -ItemType Directory -Force -Path $chromeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $ideDir | Out-Null

          # Link Antigravity IDE configuration directory to persistent path
          $ideTarget = "$HOME\.gemini\antigravity-ide"
          if (!(Test-Path (Split-Path $ideTarget))) { New-Item -ItemType Directory (Split-Path $ideTarget) | Out-Null }
          if (!(Test-Path $ideTarget)) {
            New-Item -ItemType Junction -Path $ideTarget -Value $ideDir
            Write-Host "✅ Linked Antigravity IDE directory to persistent storage."
          }

          # Create a desktop shortcut for Persistent Chrome
          $desktopPath = [Environment]::GetFolderPath("Desktop")
          $shortcutPath = Join-Path $desktopPath "Persistent Chrome.lnk"
          $wsShell = New-Object -ComObject WScript.Shell
          $shortcut = $wsShell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          $shortcut.Arguments = "--user-data-dir=`"$chromeDir`""
          $shortcut.Description = "Launches Chrome with a persistent profile stored on D:\"
          $shortcut.Save()
          Write-Host "✅ Created 'Persistent Chrome' shortcut on Desktop."
        shell: powershell

      # 5. Install Antigravity IDE
      - name: Install Antigravity IDE
        run: |
          Write-Host "Installing Antigravity CLI and IDE..."
          irm https://antigravity.google/cli/install.ps1 | iex
          winget install -e --id Google.AntigravityIDE
          reg add HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize /v SystemUsesLightTheme /t REG_DWORD /d 0 /f
          reg add HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize /v AppsUseLightTheme /t REG_DWORD /d 0 /f
          
          # Create Desktop shortcut for Antigravity IDE
          $desktopPath = [Environment]::GetFolderPath("Desktop")
          $ideExe = "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe"
          if (Test-Path $ideExe) {
            $wsShell = New-Object -ComObject WScript.Shell
            $shortcutPath = Join-Path $desktopPath "Antigravity IDE.lnk"
            $shortcut = $wsShell.CreateShortcut($shortcutPath)
            $shortcut.TargetPath = $ideExe
            $shortcut.Description = "Launches Antigravity IDE"
            $shortcut.Save()
            Write-Host "✅ Created 'Antigravity IDE' shortcut on Desktop."
          } else {
            Write-Warning "Antigravity IDE executable not found at $ideExe"
          }
        shell: powershell

      # 6. Set screen resolution to 1920x1080
      - name: Set screen resolution
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
        shell: powershell
        continue-on-error: true

      # 7. Install TightVNC + noVNC
      - name: Install TightVNC + noVNC
        run: |
          curl.exe -L https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi -o vnc.msi
          msiexec /i vnc.msi /quiet ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=password
          Start-Sleep -Seconds 5

          Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "LoopbackOnly" -Value 0
          Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AllowLoopback" -Value 1
          Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AcceptRfbConnections" -Value 1

          Restart-Service -Name "tvnserver" -Force
          Start-Sleep -Seconds 3

          pip install websockify
          curl.exe -L https://github.com/novnc/noVNC/archive/refs/heads/master.zip -o novnc.zip
          Expand-Archive novnc.zip -DestinationPath C:\novnc
        shell: powershell

      # 8. Debug check
      - name: Debug check
        run: |
          Write-Host "=== TightVNC service ==="
          Get-Service | Where-Object { $_.Name -like "*vnc*" }
          Write-Host "=== noVNC folder ==="
          Test-Path "C:\novnc\noVNC-master"
          Write-Host "=== Port 5900 ==="
          netstat -ano | findstr :5900
        shell: powershell

      # 9. Start noVNC
      - name: Start noVNC
        run: |
          Start-Process python -ArgumentList "-m websockify --web C:\novnc\noVNC-master 6080 localhost:5900" -NoNewWindow -PassThru
          $timeout = 30
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            $conn = Test-NetConnection -ComputerName localhost -Port 6080 -WarningAction SilentlyContinue
            if ($conn.TcpTestSucceeded) {
              Write-Host "✅ noVNC is up on port 6080"
              break
            }
            Write-Host "⏳ Waiting for noVNC... ($elapsed s)"
            Start-Sleep -Seconds 2
            $elapsed += 2
          }
          if ($elapsed -ge $timeout) {
            Write-Host "❌ noVNC failed to start!"
            python -m websockify --version
            netstat -ano | findstr :6080
          }
        shell: powershell

      # 10. Start Cloudflare Tunnel
      - name: Start Cloudflare Tunnel
        run: |
          curl.exe -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -o cloudflared.exe
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:6080" -RedirectStandardOutput "cf-out.log" -RedirectStandardError "cf.log" -NoNewWindow
          Start-Sleep -Seconds 10
          Write-Host "=== STDOUT ==="
          Get-Content cf-out.log -ErrorAction SilentlyContinue
          Write-Host "=== STDERR ==="
          Get-Content cf.log -ErrorAction SilentlyContinue
          $url = Get-Content cf.log | Select-String 'https://.*\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          Write-Host "========================================"
          Write-Host "OPEN: $url/vnc.html"
          Write-Host "PASSWORD: password"
          Write-Host "========================================"
        shell: powershell
# 11. Start Cloudflare and Print URL
      - name: Print CF
        run: |
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:6080" -RedirectStandardError "cf.log" -NoNewWindow
          Start-Sleep -Seconds 8
          $url = Get-Content cf.log -ErrorAction SilentlyContinue | Select-String 'https://.*\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
          
          if ($url) {
            [Console]::WriteLine("========================================")
            [Console]::WriteLine("NEW URL: $url/vnc.html")
            [Console]::WriteLine("========================================")
            [Console]::Out.Flush()

            # Pushes the URL to the GitHub Actions main dashboard
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 🌐 noVNC Connection URL"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "[$url/vnc.html]($url/vnc.html)"
          } else {
            [Console]::WriteLine("⚠️ Failed to extract Cloudflare URL on the first attempt.")
            [Console]::Out.Flush()
          }
        shell: powershell

      # 12. Keep alive + auto-restart
      - name: Keep alive + auto-restart
        run: |
          New-Item -ItemType Directory -Force -Path D:\persistent | Out-Null
          New-Item -ItemType Directory -Force -Path D:\artifacts | Out-Null

          while ($true) {
            if (Test-Path "D:\persistent\STOP") {
              Remove-Item "D:\persistent\STOP"
              [Console]::WriteLine("🛑 STOP detected, exiting...")
              [Console]::Out.Flush()
              exit 0
            }

            # Check if noVNC is running; restart if it crashed
            $novnc = Get-Process python -ErrorAction SilentlyContinue
            if (-not $novnc) {
              [Console]::WriteLine("⚠️ noVNC died, restarting...")
              [Console]::Out.Flush()
              Start-Process python -ArgumentList "-m websockify --web C:\novnc\noVNC-master 6080 localhost:5900" -NoNewWindow
              Start-Sleep -Seconds 3
            }

            # Check if Cloudflare is running; restart if it crashed
            $cf = Get-Process cloudflared -ErrorAction SilentlyContinue
            if (-not $cf) {
              [Console]::WriteLine("⚠️ cloudflared died, restarting...")
              [Console]::Out.Flush()
              Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:6080" -RedirectStandardError "cf.log" -NoNewWindow
              Start-Sleep -Seconds 8
              
              $url = Get-Content cf.log -ErrorAction SilentlyContinue | Select-String 'https://.*\.trycloudflare\.com' | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
              
              if ($url) {
                [Console]::WriteLine("🔄 RESTARTED URL: $url/vnc.html")
                [Console]::Out.Flush()
                
                # Push the new URL to the summary if it had to restart
                Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 🔄 Connection Restarted"
                Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "[$url/vnc.html]($url/vnc.html)"
              }
            }

            Start-Sleep -Seconds 10
          }
        shell: powershell

      # 12. Upload any manual artifacts
      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-artifacts
          path: D:\artifacts
          if-no-files-found: ignore

      # 13. Save the updated persistent volume (Includes Chrome and Antigravity IDE configuration)
      - name: Save persistent drive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: D:\persistent
          key: vm-persistent-windows-${{ github.run_id }}-${{ github.run_attempt }}
